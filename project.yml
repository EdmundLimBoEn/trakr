name: GearGuard
options:
  bundleIdPrefix: systems.edmundlim
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GearGuard:
    type: application
    platform: iOS
    sources:
      - GearGuard
    info:
      path: GearGuard/Resources/Info.plist
      properties:
        CFBundleDisplayName: GearGuard
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NFCReaderUsageDescription: GearGuard scans equipment tags for checkout, return, and enrollment.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: GearGuard/GearGuard.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - NDEF
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.GearGuard
        PRODUCT_NAME: GearGuard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GearGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GearGuardTests
    dependencies:
      - target: GearGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.GearGuardTests
  GearGuardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GearGuardUITests
    dependencies:
      - target: GearGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.GearGuardUITests
schemes:
  GearGuard:
    build:
      targets:
        GearGuard: all
        GearGuardTests: [test]
    test:
      targets:
        - GearGuardTests
        - GearGuardUITests
