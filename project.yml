name: Trakr
options:
  bundleIdPrefix: systems.edmundlim
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: DUU8J39BA7
    CODE_SIGN_STYLE: Automatic
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.17.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
targets:
  Trakr:
    type: application
    platform: iOS
    sources:
      - Trakr
    info:
      path: Trakr/Resources/Info.plist
      properties:
        CFBundleDisplayName: Trakr
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.918331979990-ku0gfu5mno1mhff8j8uj55qpreqbs2gl
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NFCReaderUsageDescription: Trakr scans equipment tags for checkout, return, and enrollment.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Trakr/Trakr.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - NDEF
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.trakr
        PRODUCT_NAME: Trakr
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
  TrakrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TrakrTests
    dependencies:
      - target: Trakr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.trakr.tests
        GENERATE_INFOPLIST_FILE: YES
  TrakrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TrakrUITests
    dependencies:
      - target: Trakr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.trakr.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Trakr:
    build:
      targets:
        Trakr: all
        TrakrTests: [test]
    test:
      targets:
        - TrakrTests
        - TrakrUITests
