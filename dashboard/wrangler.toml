name = "trakr-ops"
main = "./src/worker/index.ts"
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/e/*/api/*"]

[vars]
FIREBASE_PROJECT_ID = "trakr-sst-2026"
FIREBASE_AUTH_DOMAIN = "trakr-sst-2026.firebaseapp.com"
# Set FIREBASE_API_KEY via `wrangler secret put FIREBASE_API_KEY` or [vars] after creating the Web app.
